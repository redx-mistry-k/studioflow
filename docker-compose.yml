services:
  postgres:
    image: postgres:16-alpine
    container_name: studioflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studioflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studioflow_secret}
      POSTGRES_DB: studioflow
    ports:
      - "5432:5432"
    volumes:
      - studioflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studioflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: studioflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://studioflow:${POSTGRES_PASSWORD:-studioflow_secret}@postgres:5432/studioflow?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      SEED_DEMO: ${SEED_DEMO:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-hello@studioflow.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-StudioFlow}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-studioflow_verify_token}
      INSTAGRAM_PAGE_ACCESS_TOKEN: ${INSTAGRAM_PAGE_ACCESS_TOKEN:-}
      INSTAGRAM_VERIFY_TOKEN: ${INSTAGRAM_VERIFY_TOKEN:-studioflow_verify_token}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    container_name: studioflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  # Optional: self-hosted n8n for advanced automations.
  # n8n:
  #   image: n8nio/n8n:latest
  #   container_name: studioflow-n8n
  #   restart: unless-stopped
  #   ports:
  #     - "5678:5678"
  #   environment:
  #     - N8N_BASIC_AUTH_ACTIVE=true
  #     - N8N_BASIC_AUTH_USER=admin
  #     - N8N_BASIC_AUTH_PASSWORD=changeme
  #   volumes:
  #     - studioflow_n8n:/home/node/.n8n

volumes:
  studioflow_pgdata:
